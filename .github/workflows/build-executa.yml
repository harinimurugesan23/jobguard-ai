name: Build JobGuard AI Executa

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin-x86_64
            archive: tar.gz
            executable: jobguard-ai
          - os: macos-14
            platform: darwin-arm64
            archive: tar.gz
            executable: jobguard-ai
          - os: ubuntu-22.04
            platform: linux-x86_64
            archive: tar.gz
            executable: jobguard-ai
          - os: windows-2022
            platform: windows-x86_64
            archive: zip
            executable: jobguard-ai.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: executas/jobguard-ai
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable
        working-directory: executas/jobguard-ai
        run: |
          pyinstaller --onefile --name jobguard-ai jobguard_ai_plugin.py

      - name: Package Unix
        if: runner.os != 'Windows'
        working-directory: executas/jobguard-ai
        shell: bash
        run: |
          mkdir -p package
          cp dist/jobguard-ai package/jobguard-ai
          tar -czf "jobguard-ai-0.1.2-${{ matrix.platform }}.tar.gz" -C package jobguard-ai
          python -c "import hashlib; p='jobguard-ai-0.1.2-${{ matrix.platform }}.tar.gz'; print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" > "jobguard-ai-0.1.2-${{ matrix.platform }}.tar.gz.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: executas/jobguard-ai
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item dist\jobguard-ai.exe package\jobguard-ai.exe
          Compress-Archive -Path package\jobguard-ai.exe -DestinationPath "jobguard-ai-0.1.2-${{ matrix.platform }}.zip"
          (Get-FileHash "jobguard-ai-0.1.2-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash + "  jobguard-ai-0.1.2-${{ matrix.platform }}.zip" | Out-File "jobguard-ai-0.1.2-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobguard-ai-${{ matrix.platform }}
          path: |
            executas/jobguard-ai/jobguard-ai-0.1.2-${{ matrix.platform }}.*
            
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: JobGuard AI v0.1.2
          generate_release_notes: true
          files: release-assets/*